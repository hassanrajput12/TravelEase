name: CD - Deploy Develop

on:
  push:
    branches: [ develop ]
  workflow_run:
    workflows: ["CI - Develop Branch"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm init -y
        npm install --save-dev htmlhint stylelint stylelint-config-standard
        
    - name: Run linting (safety check)
      run: |
        npx htmlhint src/**/*.html
        npx stylelint "styles/**/*.css"
        
    - name: Build site
      run: |
        mkdir -p dist
        cp -r src/* dist/
        cp -r styles dist/
        echo "Build completed for develop branch"
        
    - name: Deploy to GitHub Pages (Develop)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        destination_dir: develop
        

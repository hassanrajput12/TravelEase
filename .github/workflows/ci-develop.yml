name: CI - Develop Branch

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm init -y
        npm install --save-dev htmlhint stylelint stylelint-config-standard
        
    - name: Run HTMLHint
      run: npx htmlhint src/**/*.html
      
    - name: Run Stylelint
      run: npx stylelint "styles/**/*.css"
      
    - name: Check for broken links (basic)
      run: |
        echo "Checking for common HTML issues..."
        grep -r "href=\"\"" src/ && exit 1 || echo "No empty href attributes found"
        grep -r "src=\"\"" src/ && exit 1 || echo "No empty src attributes found"